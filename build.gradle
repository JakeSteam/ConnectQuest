buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // API 37 needs AGP 9.3+, which in turn needs Gradle 9.5.0.
        classpath 'com.android.tools.build:gradle:9.3.1'
    }
}

ext {
    apiVersion = 37
    compileVersion = 37
    supportLibraryVersion = '25.1.0'
    // Stays at 21.0.0: games-v2 22.x needs minSdk 24, and Billing 9 pins this app to 23.
    gamesLibraryVersion = '21.0.0'
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url "https://jitpack.io"
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
